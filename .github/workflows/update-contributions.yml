name: update contributions graph

# Regenera contributions.svg todo dia, para o grafico do README nao envelhecer.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC ~ 03:17 em Belem (UTC-3)
  workflow_dispatch:        # permite rodar sob demanda pela aba Actions

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar contributions.svg
        env:
          # PROFILE_TOKEN e um PAT opcional (escopos read:user + repo) para
          # incluir contribuicoes de repositorios privados. Sem ele, o grafico
          # mostra apenas o que e publico.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/make_contrib_svg.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- contributions.svg; then
            echo "sem mudanca no grafico, nada a commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git commit -m "chore: atualiza grafico de contribuicoes"
          git push
